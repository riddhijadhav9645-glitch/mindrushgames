services:
  - type: web
    name: mindrush-game
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/mindrush.sqlite3
    disk:
      name: mindrush-data
      mountPath: /var/data
      sizeGB: 1
